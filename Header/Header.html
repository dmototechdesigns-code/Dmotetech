<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMotoTech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>
<script src="../Globalfile/Global.js"></script>

</script>

<body>

    <!-- HEADER NAVBAR -->
    <header class="dmt-head-moto-header">
        <div class="dmt-head-moto-header-container">
            <button class="dmt-mobile-menu-toggle" onclick="toggleMobileNav()">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="dmt-head-moto-logo-area">
                <a href="/index.html">
                    <img src="https://res.cloudinary.com/dhrqbdrkh/image/upload/v1782471800/dmotottech_awtowl.png"
                        class="dmt-head-moto-brand-logo" alt="DMotoTech">
                </a>
            </div>

            <nav class="dmt-head-moto-navbar">
                <ul class="dmt-head-moto-nav-list">
                    <li><a href="/Dmotetech/index.html" class="dmt-web-link">Hom</a></li>
                    <li><a href="/Dmotetech/Shop/Shop.html" class="dmt-web-link">Shop</a></li>
                    <li><a href="/Dmotetech/Blog_page.html" class="dmt-web-link">Blog</a></li>
                    <li><a href="/Dmotetech/About/About_page.html" class="dmt-web-link">About Us</a></li>
                    <li><a href="/Dmotetech/Contact/Contact.html" class="dmt-web-link">Contact</a></li>
                </ul>
            </nav>

            <div class="dmt-head-moto-header-utils">
                <!-- Auth Buttons (Desktop) -->
                <div id="dmt-auth-buttons-group" style="display:flex; gap:8px; align-items:center;">
                    <!-- Yahan JS se Login/Signup aayenge -->
                </div>

                <!-- Desktop Profile Dropdown -->
                <div class="dmt-profile-wrapper" id="dmt-profile-wrapper">
                    <div class="dmt-profile-avatar" id="dmt-profile-avatar" onclick="toggleProfileDropdown()">U</div>
                    <div class="dmt-profile-dropdown" id="dmt-profile-dropdown">
                        <div class="dmt-dropdown-header">
                            <div class="dmt-dropdown-email" id="dmt-dropdown-email">user@email.com</div>
                            <div class="dmt-dropdown-subtext">Welcome to DMotoTech</div>
                        </div>
                        <div class="dmt-dropdown-menu">
                            <a href="../My_Account_page/My_account.html" class="dmt-dropdown-item">
                                <i class="fa-solid fa-user"></i> My Account
                            </a>
                            <a href="../My_Account_page/My_account.html" class="dmt-dropdown-item">
                                <i class="fa-solid fa-bag-shopping"></i> My Orders
                            </a>
                            <div class="dmt-dropdown-divider"></div>
                            <button class="dmt-dropdown-item dmt-logout" onclick="logoutUser()">
                                <i class="fa-solid fa-right-from-bracket"></i> Logout
                            </button>
                        </div>
                    </div>
                </div>

                <a href="javascript:void(0)" class="dmt-head-moto-utility-link" id="headerCartIcon"
                    onclick="toggleCartDrawer()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="dmt-header-cart-count" class="dmt-header-cart-badge" style="display:none;">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MOBILE NAV OVERLAY & PANEL -->
    <div class="dmt-mobile-nav-overlay" id="mobileNavOverlay" onclick="closeMobileNav()"></div>
    <div class="dmt-mobile-nav-panel" id="mobileNavPanel">
        <div class="dmt-mobile-nav-header">
            <img src="https://res.cloudinary.com/dhrqbdrkh/image/upload/v1782471800/dmotottech_awtowl.png"
                class="dmt-mobile-nav-brand-img" alt="DMotoTech">
            <button class="dmt-mobile-nav-close" onclick="closeMobileNav()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <ul class="dmt-mobile-nav-links">
            <li><a href="/Dmotetech/index.html"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="/Dmotetech/About/About_page.html"><i class="fa-solid fa-users"></i> About</a></li>
            <li><a href="/Dmotetech/Shop/Shop.html"><i class="fa-solid fa-store"></i> Shop</a></li>
            <li><a href="/Dmotetech/Blog_page.html"><i class="fa-solid fa-newspaper"></i> Blog</a></li>
            <li><a href="/Dmotetech/Contact/Contact.html"><i class="fa-solid fa-envelope"></i> Contact</a></li>
        </ul>
        <div class="dmt-mobile-auth-wrapper" id="dmt-mobile-auth-container">
            <!-- Yahan JS se mobile login/profile aayega -->
        </div>
    </div>

    <!-- CART DRAWER -->
    <div class="dmt-cart-drawer-overlay" id="cartOverlay" onclick="toggleCartDrawer()"></div>
    <div class="dmt-cart-drawer-panel" id="cartDrawer">
        <div class="dmt-cart-drawer-header">
            <div class="dmt-cart-header-left">
                <h3 class="dmt-cart-drawer-title">Your Cart</h3>
                <span id="dmt-cart-drawer-subcount" class="dmt-cart-drawer-subcount">0 Items</span>
            </div>
            <button class="dmt-cart-drawer-close" onclick="toggleCartDrawer()">✕</button>
        </div>
        <div class="dmt-cart-drawer-content" id="cartDrawerContainer"></div>
        <div class="dmt-cart-drawer-footer" id="cartDrawerFooter" style="display:none;">
            <div class="dmt-cart-total-bar">
                <span class="dmt-cart-total-label">Subtotal Amount:</span>
                <span id="dmt-cart-drawer-total" class="dmt-cart-total-value">₹0</span>
            </div>
            <p class="dmt-cart-tax-notice">Shipping & taxes calculated at checkout.</p>
            <button class="dmt-checkout-btn" onclick="triggerRazorpayCheckout()">
                <i class="fa-solid fa-lock" style="margin-right:6px;"></i> Proceed to Checkout
            </button>
        </div>
    </div>

</body>

</html>
