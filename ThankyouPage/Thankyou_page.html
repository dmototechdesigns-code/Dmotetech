<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You For Your Order | DMotoTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Global CSS -->
    <link rel="stylesheet" href="../Header/Header.css">
    <link rel="stylesheet" href="../footer/footer.css">

    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="./ThankyouPage.css">

    <!-- Scripts -->
    <script src="../Js_file_global/Thankyou001.js" defer></script>
    <script src="../Header/header.js" defer></script>
</head>

<body>

    <div id="global-header"></div>

    <!-- Main Wrapper -->
    <main class="dm-ty-page-wrapper">
        <div class="dm-ty-container">
            <div class="dm-ty-card">

                <!-- Animated Success Icon -->
                <div class="dm-ty-icon-wrapper">
                    <div class="dm-ty-icon-pulse"></div>
                    <i class="fa-solid fa-check"></i>
                </div>

                <h1 class="dm-ty-title">Thank You for Your Order!</h1>

                <p class="dm-ty-description">
                    Your payment and order details have been successfully processed. We have received your order and our
                    team is already getting it ready for shipment.
                </p>

                <!-- Order Status Info Box -->
                <div class="dm-ty-info-box">
                    <i class="fa-solid fa-truck-fast"></i>
                    <span>Shipping updates will be sent directly to your registered email and phone number.</span>
                </div>

                <!-- Action Buttons -->
                <div class="dm-ty-actions">
                    <a href="../Shop/Shop.html" class="dm-ty-btn dm-ty-btn-primary">
                        <i class="fa-solid fa-bag-shopping"></i> Continue Shopping
                    </a>
                    <a href="../My_Account_page/My_account.html" class="dm-ty-btn dm-ty-btn-secondary">
                        <i class="fa-solid fa-receipt"></i> View My Orders
                    </a>
                </div>

            </div>
        </div>
    </main>

    <div id="global-footer"></div>

</body>

</html>
